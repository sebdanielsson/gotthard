name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          files=$(git ls-files '*.sh' 'packages/gotthard-base/gotthard-board' \
            'packages/gotthard-base/gotthard-getty' 'packages/gotthard-base/*.commit-hook' \
            'packages/gotthard-base/*.post-*' 'packages/gotthard-base/*.initd')
          # Scripts run under BusyBox ash (Alpine, OpenWrt). SC2034: OpenRC's
          # `description` variables are read by openrc-run.
          # koalaman/shellcheck-alpine v0.11.0
          # shellcheck disable=SC2086
          docker run --rm --volume "$PWD:/mnt" --workdir /mnt \
            koalaman/shellcheck-alpine@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183 \
            shellcheck --shell=busybox --severity=warning --exclude=SC2034 $files

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          # rhysd/actionlint 1.7.12
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        run: |
          # davidanson/markdownlint-cli2 v0.24.0
          docker run --rm --volume "$PWD:/workdir" \
            davidanson/markdownlint-cli2@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca \
            "**/*.md" "#**/node_modules" "#web/target"
