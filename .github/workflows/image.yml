name: image

# Builds the BPI-R4 image (official OpenWrt kernel, or a kernel bundle from
# the kernel workflow) and boots the same boot media twice in QEMU with the
# self-test.

on:
  push:
    branches: [main]
    paths:
      - image/**
      - packages/**
      - kernel/openwrt.env
      - kernel/kmods.list
      - scripts/build-image.sh
      - scripts/test-qemu.sh
      - .github/workflows/image.yml
  pull_request:
    paths:
      - image/**
      - packages/**
      - kernel/openwrt.env
      - kernel/kmods.list
      - scripts/build-image.sh
      - scripts/test-qemu.sh
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Run ID of a kernel workflow run to take the kernel bundle from (empty = official OpenWrt kernel)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # download a kernel bundle from another run
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download kernel bundle
        if: inputs.kernel_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-bundle-bpir4
          path: out/kernel-bundle
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ github.token }}

      - name: Build image
        run: sh scripts/build-image.sh --qemu

      - name: Boot test in QEMU
        run: |
          . image/builder.env
          kvm=""
          [ -e /dev/kvm ] && kvm="--device /dev/kvm"
          # shellcheck disable=SC2086
          docker run --rm $kvm --volume "$PWD:/src" --workdir /src "$BUILDER_IMAGE" \
            sh -c 'apk add --no-cache --quiet qemu-system-aarch64 qemu-img && TIMEOUT=1500 sh scripts/test-qemu.sh'

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-console-logs
          path: out/qemu/selftest-*.log
          if-no-files-found: ignore

      # CI images use throw-away passwords; credentials.txt is never uploaded.
      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gotthard-bpir4
          path: |
            out/bpir4/gotthard-bpir4.itb
            out/bpir4/media.tar.gz
            out/bpir4/packages.lock
            out/bpir4/gotthard-release
            out/bpir4/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
