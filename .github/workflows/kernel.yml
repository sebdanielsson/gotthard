name: kernel

# Builds the BPI-R4 kernel bundle (kernel, DTBs, kmods) with the OpenWrt build
# system and Gotthard's kernel options. Slow (1-2 h), so it only runs when the
# kernel definition changes or on demand.

on:
  push:
    branches: [main]
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build the builder image
        run: docker build --tag gotthard-kbuilder --file kernel/Dockerfile.builder kernel

      - name: Prepare work directories
        run: mkdir -p "$RUNNER_TEMP/openwrt/dl" "$RUNNER_TEMP/out"

      - name: Restore OpenWrt source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openwrt/dl
          key: openwrt-dl-${{ hashFiles('kernel/openwrt.env', 'kernel/kmods.list', 'kernel/config/**') }}
          restore-keys: openwrt-dl-

      - name: Build kernel bundle
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/openwrt:/home/builder/openwrt" \
            --volume "$RUNNER_TEMP/out:/home/builder/out" \
            gotthard-kbuilder sh /src/kernel/build-openwrt.sh

      - name: Upload kernel bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-bundle-bpir4
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
