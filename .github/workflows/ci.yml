name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Run ID of a kernel workflow run to take the kernel bundle from (empty = official OpenWrt kernel)
        required: false
        default: ""

# Every job declares the permissions it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All versions are pinned: actions by commit SHA, container images by digest.
# Renovate keeps them up to date (see renovate.json). The image builder's own
# container is pinned in image/builder.env.
env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
  MARKDOWNLINT_IMAGE: davidanson/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          # Scripts run under BusyBox ash (Alpine, OpenWrt). SC2034: OpenRC
          # reads the `description` variables of init scripts.
          git ls-files -z '*.sh' 'packages/gotthard-base/gotthard-board' \
            'packages/gotthard-base/gotthard-getty' 'packages/gotthard-base/*.commit-hook' \
            'packages/gotthard-base/*.post-*' 'packages/gotthard-base/*.initd' |
            xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" \
              --shell=busybox --severity=warning --exclude=SC2034

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "$ZIZMOR_IMAGE" \
            --format github --min-severity low .github/workflows

      - name: Markdownlint
        run: |
          docker run --rm -v "$PWD:/workdir:ro" "$MARKDOWNLINT_IMAGE" \
            "**/*.md" "#**/node_modules" "#web/target"

  backend:
    name: Web backend (fmt, clippy, test)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  frontend:
    name: Web frontend (lint, typecheck, build)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          package-manager-cache: false

      - name: Install the pinned npm (packageManager)
        run: |
          npm_version="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          npm install --global "npm@${npm_version}"
          npm --version

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Lint (prettier, eslint)
        run: npm run lint

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build

  web-build:
    name: Web GUI binary (aarch64 musl)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in the pinned containers
        env:
          GOTTHARD_VERSION: ${{ github.sha }}
        run: sh scripts/build-web.sh aarch64-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gotthard-web-aarch64
          path: out/web/gotthard-web-aarch64
          if-no-files-found: error
          retention-days: 14

  image:
    name: Image and QEMU boot test
    needs: [web-build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # download a kernel bundle from a kernel workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the web GUI binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gotthard-web-aarch64
          path: out/web

      - name: Download kernel bundle
        if: inputs.kernel_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-bundle-bpir4-*
          merge-multiple: true
          path: out/kernel-bundle
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ github.token }}

      - name: Build image
        run: sh scripts/build-image.sh --qemu

      - name: Boot test in QEMU
        run: |
          . image/builder.env
          kvm=""
          [ -e /dev/kvm ] && kvm="--device /dev/kvm"
          # shellcheck disable=SC2086
          docker run --rm $kvm -v "$PWD:/src" -w /src "$BUILDER_IMAGE" \
            sh -c 'apk add --no-cache --quiet qemu-system-aarch64 qemu-img && TIMEOUT=1500 sh scripts/test-qemu.sh'

      - name: Test the SD card installer
        run: sh scripts/test-install-sd.sh

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-console-logs
          path: out/qemu/selftest-*.log
          if-no-files-found: ignore

      # CI images use throw-away passwords; credentials.txt is never uploaded.
      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gotthard-bpir4
          path: |
            out/bpir4/gotthard-bpir4.itb
            out/bpir4/media.tar.gz
            out/bpir4/packages.lock
            out/bpir4/gotthard-release
            out/bpir4/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  ci:
    name: ci
    # The single required status check for the default branch ruleset and for
    # Renovate automerge. It fails unless every job above succeeded.
    if: always()
    needs: [lint, backend, frontend, web-build, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with: $result"
              exit 1
            fi
          done
