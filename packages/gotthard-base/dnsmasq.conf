# Gotthard defaults: DHCP, DNS and IPv6 router adverts on the LAN bridge.
# Site-specific settings (static leases, upstream servers) go in other files
# in /etc/dnsmasq.d/.

interface=br-lan
bind-dynamic
domain-needed
bogus-priv
stop-dns-rebind
rebind-localhost-ok
local=/lan/
domain=lan
expand-hosts
cache-size=1000
edns-packet-max=1232

dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-range=set:lan,192.168.1.100,192.168.1.249,255.255.255.0,12h

# IPv6: SLAAC plus stateless DHCPv6 on whatever prefix is on br-lan
# (delegated by dhcpcd, plus any ULA).
enable-ra
dhcp-range=set:lan,::,constructor:br-lan,ra-stateless,ra-names,12h
