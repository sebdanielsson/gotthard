# Gotthard: dhcpcd only manages the WAN. It gets IPv4, IPv6 (RA + DHCPv6)
# and a delegated prefix, and puts a /64 from that prefix on br-lan.
allowinterfaces br-wan

duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
option ntp_servers
require dhcp_server_identifier
slaac private
noipv6rs

interface br-wan
	ipv6rs
	ia_na 1
	ia_pd 2 br-lan/0/64
